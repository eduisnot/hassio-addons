name: "Watcharr"
description: "A movie, TV show, and game watchlist tracker"
version: "v4.2.2"
slug: "watcharr"
init: false
arch:
  - amd64
  - aarch64
image: "ghcr.io/sbondco/watcharr"
startup: application
panel_icon: "mdi:movie-roll"
panel_title: "Watcharr"
ingress: true
ingress_port: 3080
# ---- CONFIGURACIÓN ESTÁNDAR OFICIAL DE HOME ASSISTANT ----
map:
  - addon_config:rw # <- Esto monta /addon_configs/watcharr de HAOS en la ruta interna /config del contenedor
ports:
  3080/tcp: null
options: {}
schema: {}
# ---- AQUÍ TRADUCIMOS LA RUTA DE LA APLICACIÓN ----
environment:
  APP_DATA_DIR: "/config" # <- Le ordena a Watcharr trabajar por completo dentro de la carpeta mapeada
