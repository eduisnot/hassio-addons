name: "Watcharr Local"
description: "Un gestor autohospedado para tus listas de seguimiento de películas, series y videojuegos"
version: "v4.2.2"
slug: "watcharr_local"
init: false
arch:
  - amd64
  - aarch64
image: "ghcr.io/sbondco/watcharr"
startup: application
panel_icon: "mdi:movie-roll"
panel_title: "Watcharr"
ingress: true
ingress_port: 3080
map:
  - share:rw
options:
  port: 3080
schema:
  port: port
ports:
  3080/tcp: 3080
# ---- ESTO OBLIGA A WATCHARR A ESCRIBIR EN LA CARPETA COMPARTIDA DE HAOS ----
environment:
  DB_PATH: "/share/watcharr.db"
