name: "Watcharr"
description: "A movie, TV show, and game watchlist tracker"
version: "v4.2.2"
slug: "watcharr"
init: false
arch:
  - amd64
  - aarch64
image: "ghcr.io/sbondco/watcharr"
startup: application
panel_icon: "mdi:movie-roll"
panel_title: "Watcharr"
ingress: true
ingress_port: 3080
map:
  - addon_config:rw # <- Habilita la ruta física /addon_configs/watcharr
# ---- AQUÍ ESTÁ LA SOLUCIÓN DEFINITIVA DE RUTAS ----
binds:
  - "addon_config:/data:rw" # <- Vincula la carpeta interna fija (/data) con tu carpeta visible de HAOS
ports:
  3080/tcp: null
options: {}
schema: {}
