name: "Dockhand Local"
description: "Administrador moderno de Docker y Docker Compose integrado en Home Assistant"
version: "v1.0.51"
slug: "dockhand_local"
init: false
arch:
  - amd64
  - aarch64
  - armv7
image: fnsys/dockhand
startup: application
panel_icon: "mdi:docker"
panel_title: "Dockhand"
ingress: true
ingress_port: 3000
privileged:
  - SYS_ADMIN
host_pid: true
map:
  - share:rw
# ---- ESTO ABRE EL PUERTO HACIA TU RED LOCAL ----
options:
  port: 3000
schema:
  port: port
ports:
  3000/tcp: 3000
