name: "Homer Dashboard"
version: "latest"
slug: "homer"
description: "A lightweight static dashboard for self-hosted services"
url: "https://github.com/bastienwirtz/homer"

arch:
  - aarch64
  - amd64

image: "b4bz/homer"

init: false
startup: "application"
boot: "auto"

ports:
  8080/tcp: 8080

ports_description:
  8080/tcp: "Homer web interface"

webui: "http://[HOST]:[8080]"

ingress: false

map:
  - type: app_configs
    read_only: false
    path: /www/assets

environment:
  INIT_ASSETS: "1"
  PORT: "8080"

panel_icon: "mdi:view-dashboard"
