name: "Homer Dashboard"
version: "latest"
slug: "homer-dashboard"
description: "A simple static homepage for your server, easy to configure via a single yaml file."
url: "https://github.com"

arch:
  - aarch64
  - amd64

image: "b4bz/homer"

init: false
startup: "application"
boot: "auto"

ports:
  8080/tcp: 8080

ports_description:
  8080/tcp: "Homer WebUI (HTTP)"
  
webui: "http://[HOST]:[PORT:8080]"

map:
  - addon_config:rw

options:
  TZ: "Europe/Madrid"

schema:
  TZ: str

environment:
  TZ: "Europe/Madrid"
  assets: "/config"      # <-- Hace que Homer busque la configuración en /addon_configs
  INIT_ASSETS: "0"      # <-- Apaga el instalador problemático interno de la imagen
  UID: "0"              # <-- Fuerza permisos root para que no falle la lectura del directorio
  GID: "0"              # <-- Fuerza permisos root para el grupo

panel_icon: "mdi:home-dashboard"
