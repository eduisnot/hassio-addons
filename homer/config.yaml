name: "Homer Dashboard"
version: "latest"
slug: "homer-dashboard"
description: "A simple static homepage for your server, easy to configure via a single yaml file."
url: "https://github.com"

arch:
  - aarch64
  - amd64

image: "b4bz/homer"

init: false
startup: "application"
boot: "auto"

ports:
  8080/tcp: 8080

ports_description:
  8080/tcp: "Homer WebUI (HTTP)"
  
webui: "http://[HOST]:[PORT:8080]"

map:
  - addon_config:rw

options:
  TZ: "Europe/Madrid"

schema:
  TZ: str

environment:
  TZ: "Europe/Madrid"
  assets: "/config"      # <-- Mapea los ajustes a la ruta de addon_config interna
  INIT_ASSETS: "1"      # <-- Le dice a Homer que inicialice el config.yml de ejemplo allí
  SUB_FOLDER: ""        # <-- Evita errores de rutas relativas con el servidor web estático

panel_icon: "mdi:home-dashboard"
