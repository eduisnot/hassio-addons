name: "Homer Dashboard"
version: "latest"
slug: "homer"
description: "A lightweight static dashboard for self-hosted services"

arch:
  - aarch64
  - amd64

init: false

url: "https://github.com/bastienwirtz/homer"

image: "b4bz/homer"

webui: "http://[HOST]:[8080]"

ports:
  8080/tcp: 8080

ports_description:
  8080/tcp: "Homer web interface"

map:
  - type: addon_config
    read_only: false
    path: /www/assets

environment:
  INIT_ASSETS: "1"
  PORT: "8080"
