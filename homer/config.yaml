name: "Homer Dashboard"
version: "latest"
slug: "homer"
description: "Homer is a static dashboard for organizing and accessing your self-hosted services."
url: "https://github.com/bastienwirtz/homer"

arch:
  - aarch64
  - amd64

image: "b4bz/homer"

init: false
startup: "application"
boot: "auto"

ports:
  8080/tcp: 8080

ports_description:
  8080/tcp: "Homer Dashboard WebUI"

webui: "http://[HOST]:[8080]"

watchdog: "http://[HOST]:[8080]"

map:
  - type: addon_config
    read_only: false
    path: /www/assets

environment:
  INIT_ASSETS: "1"

panel_icon: "mdi:view-dashboard"
panel_title: "Homer"
