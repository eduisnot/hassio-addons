name: "Kiwix"
description: "Kiwix - offline .zim server serving files from /share/kiwix"
version: "1.0.1"
slug: "kiwix"
init: false
arch:
  - amd64
  - aarch64
  - armv7
# ---- LA RUTA CORRECTA EN GITHUB REGISTRY ----
image: "ghcr.io/kiwix/kiwix-serve:latest"
startup: application
panel_icon: "mdi:wikipedia"
ingress: true
ingress_port: 8080
map:
  - share:ro # Mapea tu carpeta /share de HAOS en modo lectura
ports:
  8080/tcp: 8080
options: {}
schema: {}
# ---- COMANDO INTERNO DE KIWIX PARA APUNTAR A LA CARPETA COMPARTIDA ----
args:
  - "--port=8080"
  - "/share/kiwix/*.zim"
