name: Kiwix
version: "1.0.0"
slug: kiwix
description: Servidor Kiwix para consultar archivos ZIM almacenados en /share/kiwix
url: "https://github.com/TU_USUARIO/TU_REPOSITORIO"
image: "ghcr.io/kiwix/kiwix-serve"
arch:
  - aarch64
  - amd64
  - armv7

startup: services
init: false

ports:
  8080/tcp: 8080

ports_description:
  8080/tcp: Interfaz web de Kiwix

webui: "http://[HOST]:[8080]"

map:
  - share:rw

options:
  library_file: ""
  zim_file: ""

schema:
  library_file: str?
  zim_file: str?

environment:
  TZ: Europe/Madrid
