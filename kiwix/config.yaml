name: "Kiwix"
description: "Kiwix - offline .zim server serving files from /share/kiwix"
version: "1.0.1"
slug: "kiwix"
init: false
arch:
  - amd64
  - aarch64
  - armv7
image: "kiwix/kiwix-serve" # <- Descarga la imagen oficial lista para usar sin compilar nada
startup: application
panel_icon: "mdi:wikipedia"
ingress: true # Opcional: Te permite verlo integrado en la barra lateral de HA
ingress_port: 8080
map:
  - share:ro # <- Mapea de forma segura tu carpeta /share de HAOS en modo solo lectura
ports:
  8080/tcp: 8080
options: {}
schema: {}
# ---- AQUÍ REEMPLAZAMOS EL RUN.SH PASANDO LOS ARGUMENTOS DIRECTOS AL BINARIO ----
args:
  - "*.zim" # <- Comando nativo de la imagen oficial de Kiwix para leer todos los archivos .zim de la raíz montada
